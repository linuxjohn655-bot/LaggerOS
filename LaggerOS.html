/* ---------- accounts: set up on first run, log in on every open ---------- */
const AKEY='laggeros.acct.v1',MIN_AGE=9;
function wipeAll(){
  try{Object.keys(localStorage).filter(k=>k.startsWith('laggeros.')).forEach(k=>localStorage.removeItem(k))}catch(e){}
  Object.keys(mem).forEach(k=>delete mem[k]);
  try{indexedDB.deleteDatabase('laggeros-music')}catch(e){}
}
function eraseCountdown(){
  const SECS=10;
  const ov=el('div','modal'),bx=el('div','box');ov.style.zIndex=10200;bx.style.cssText='text-align:center;min-width:320px';
  bx.innerHTML=`<div class="mt red" style="font-size:15px;letter-spacing:2px">ERASING ALL DATA</div>
    <div class="big red" id="ec">${SECS}</div>
    <div class="meter" style="margin:8px 0"><div class="b"><i id="eb" style="width:100%;background:var(--red);transition:width 1s linear"></i></div></div>
    <div class="dm" id="et" style="margin-bottom:12px;min-height:18px">starting…</div><button class="btn">cancel</button>`;
  ov.append(bx);document.body.append(ov);
  const steps=['wiping account…','wiping files…','wiping profile…','wiping settings…','wiping saved scores and notes…','almost gone…'];
  let s=SECS;const ec=bx.querySelector('#ec'),eb=bx.querySelector('#eb'),et=bx.querySelector('#et');
  const iv=setInterval(()=>{
    s--;ec.textContent=s;eb.style.width=(s/SECS*100)+'%';
    et.textContent=s>0?steps[Math.min(steps.length-1,Math.floor((SECS-s)/2))]:'erasing…';
    beep(220+(SECS-s)*30,.05,'square',.6);
    if(s<=0){
      clearInterval(iv);wipeAll();et.textContent='erased. restarting…';bx.querySelector('.btn').disabled=true;
      setTimeout(()=>location.reload(),700);
    }
  },1000);
  et.textContent=steps[0];eb.style.width=(100)+'%';
  bx.querySelector('.btn').onclick=()=>{clearInterval(iv);ov.remove();toast('erase cancelled — nothing was deleted')};
}
function cyrb53(str,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(h2>>>0).toString(16).padStart(8,'0')+(h1>>>0).toString(16).padStart(8,'0')}
const slowHash=s=>{let h=s;for(let i=0;i<5000;i++)h=cyrb53(h+s,i);return h};
const toHex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function hashPw(pw,salt,scheme){
  if(scheme!=='f1'&&window.crypto&&crypto.subtle){
    try{
      const enc=new TextEncoder(),k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
      return{scheme:'p1',hash:toHex(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:enc.encode(salt),iterations:100000},k,256))};
    }catch(e){}
  }
  return{scheme:'f1',hash:slowHash(salt+':'+pw)};
}
const randSalt=()=>{try{return toHex(crypto.getRandomValues(new Uint8Array(16)))}catch(e){return cyrb53(String(Math.random())+Date.now())+cyrb53(String(Math.random()))}};
function loadAcct(){try{const a=JSON.parse(store.get(AKEY));return a&&a.user&&a.hash&&a.salt?a:null}catch(e){return null}}

function authScreen(build){
  const ov=el('div','auth'),bx=el('div','abox');ov.append(bx);document.body.append(ov);
  build(bx,ov);return ov;
}
const pwField=(id)=>`<div class="pw"><input id="${id}" type="password" autocomplete="off" spellcheck="false"><button type="button" class="btn sh">show</button></div>`;
function wireShow(bx){bx.querySelectorAll('.sh').forEach(b=>b.onclick=()=>{const i=b.previousElementSibling;i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'show':'hide'})}

function showSetup(done){
  authScreen((bx,ov)=>{
    bx.innerHTML=`<h2>LAGGEROS</h2><div class="sub">new device detected · create your account</div>
      <label>USERNAME</label><input id="au" maxlength="16" autocomplete="off" spellcheck="false" placeholder="3-16 letters, numbers, - or _">
      <label>PASSWORD</label>${pwField('ap')}
      <label>CONFIRM PASSWORD</label>${pwField('ap2')}
      <label>AGE</label><input id="aa" type="number" min="1" max="120" placeholder="LaggerOS is for ages ${MIN_AGE}+">
      <div class="err"></div><button class="btn go">CREATE ACCOUNT</button>
      <div class="fine">Everything stays on this laptop. Nothing is ever sent anywhere, because there is no network. Your password is stored scrambled, not as text. Write it down somewhere safe: if you forget it, the only way back in is to erase all data.</div>`;
    wireShow(bx);
    const q=s=>bx.querySelector(s),err=q('.err');
    const fail=m=>{err.textContent=m;bx.classList.remove('shk');void bx.offsetWidth;bx.classList.add('shk')};
    const submit=async()=>{
      const u=q('#au').value.trim(),p=q('#ap').value,p2=q('#ap2').value,age=Number(q('#aa').value);
      if(!/^[A-Za-z0-9_-]{3,16}$/.test(u))return fail('Username: 3-16 letters, numbers, - or _ only.');
      if(p.length<4)return fail('Password must be at least 4 characters.');
      if(p!==p2)return fail('Passwords do not match.');
      if(!q('#aa').value||!Number.isInteger(age)||age<1||age>120)return fail('Please enter your age as a whole number.');
      if(age<MIN_AGE)return fail(`Sorry, LaggerOS is for ages ${MIN_AGE} and up. No account was created.`);
      q('.go').disabled=true;
      const salt=randSalt(),h=await hashPw(p,salt);
      store.set(AKEY,JSON.stringify({user:u,salt,scheme:h.scheme,hash:h.hash,age,created:Date.now()}));
      P.name=u;saveP();ov.remove();done(true);
    };
    q('.go').onclick=submit;
    bx.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
    setTimeout(()=>q('#au').focus(),30);
  });
}

function showLogin(acct,done){
  authScreen((bx,ov)=>{
    bx.innerHTML=`<h2>LAGGEROS</h2><div class="sub">locked · log in to continue</div>
      <label>USERNAME</label><input id="au" maxlength="16" autocomplete="off" spellcheck="false">
      <label>PASSWORD</label>${pwField('ap')}
      <div class="err"></div><button class="btn go">LOG IN</button>
      <div class="fine"><a class="fg">forgot username or password? erase data</a></div>`;
    wireShow(bx);
    const q=s=>bx.querySelector(s),err=q('.err'),go=q('.go');
    let fails=0,locked=false;
    const fail=m=>{err.textContent=m;bx.classList.remove('shk');void bx.offsetWidth;bx.classList.add('shk')};
    const lock=()=>{
      locked=true;go.disabled=true;let s=Math.min(30,5*(fails-2));
      const iv=setInterval(()=>{
        if(s<=0){clearInterval(iv);locked=false;go.disabled=false;err.textContent='';return}
        err.textContent=`too many tries — wait ${s}s`;s--;
      },1000);
      err.textContent=`too many tries — wait ${s}s`;
    };
    const submit=async()=>{
      if(locked)return;
      const u=q('#au').value.trim(),p=q('#ap').value;
      go.disabled=true;
      const h=await hashPw(p,acct.salt,acct.scheme||'p1');
      go.disabled=false;
      if(u.toLowerCase()===acct.user.toLowerCase()&&h.hash===acct.hash){
        P.name=acct.user;saveP();ov.remove();done(false);return;
      }
      fails++;fail('Wrong username or password.');q('#ap').value='';
      if(fails>=3)lock();
    };
    go.onclick=submit;
    bx.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
    q('.fg').onclick=()=>modal('Erase ALL LaggerOS data on this laptop? That deletes your account, files, profile and settings, and cannot be undone. You will then create a new account.',{ok:'erase everything'},eraseCountdown);
    setTimeout(()=>q('#au').focus(),30);
  });
}

const startBoot=()=>{CFG.bootanim===false?finish():step()};
{const acct=loadAcct();acct?showLogin(acct,startBoot):showSetup(startBoot)}

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LaggerOS</title>
<style>
:root{
  --bg:#07080a; --panel:#0e1013; --line:#23272d; --ink:#d8d2c0; --dim:#6f6c62;
  --amber:#ffb000; --red:#ff4d3d; --green:#7dff9b;
  --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:13px/1.5 var(--mono)}
::selection{background:var(--amber);color:#000}
#boot{position:fixed;inset:0;background:#000;padding:32px;z-index:9999;overflow:hidden;color:var(--amber);white-space:pre-wrap;cursor:pointer}
#boot .ok{color:var(--green)} #boot .bad{color:var(--red)} #boot .dim{color:var(--dim)}
#desk{position:fixed;inset:0 0 34px 0;
  background:
    radial-gradient(ellipse at 50% 120%,#1a1408 0,transparent 60%),
    repeating-linear-gradient(0deg,rgba(255,176,0,.025) 0 1px,transparent 1px 3px),
    var(--bg);}
#scan{position:fixed;inset:0;pointer-events:none;z-index:9000;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
#mark{position:absolute;right:28px;bottom:22px;text-align:right;color:#2a2616;font-size:64px;font-weight:700;letter-spacing:-3px;user-select:none;line-height:1}
#mark small{display:block;font-size:11px;letter-spacing:3px;color:#3a3420;font-weight:400;margin-top:6px}
.icons{position:absolute;left:18px;top:18px;bottom:18px;display:grid;gap:10px;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,74px);grid-auto-columns:84px;align-content:start;column-gap:8px}
.icon{width:84px;text-align:center;cursor:pointer;padding:8px 4px;border:1px solid transparent}
.icon:hover{border-color:var(--line);background:rgba(255,176,0,.05)}
.icon b{display:block;font-size:26px;color:var(--amber);font-weight:400}
.icon span{font-size:11px;color:var(--dim)}
.win{position:absolute;background:var(--panel);border:1px solid var(--line);box-shadow:8px 8px 0 rgba(0,0,0,.55);display:flex;flex-direction:column;min-width:260px;min-height:140px}
.win.focus{border-color:var(--amber);box-shadow:8px 8px 0 rgba(255,176,0,.10)}
.tb{display:flex;align-items:center;gap:8px;padding:5px 8px;border-bottom:1px solid var(--line);cursor:grab;user-select:none;background:#0a0b0d}
.win.focus .tb{background:#17120a}
.tb .t{flex:1;color:var(--dim);letter-spacing:1px;text-transform:uppercase;font-size:11px}
.win.focus .tb .t{color:var(--amber)}
.tb button{background:none;border:1px solid var(--line);color:var(--dim);width:20px;height:20px;cursor:pointer;font:inherit;line-height:1}
.tb button:hover{color:#000;background:var(--red);border-color:var(--red)}
.body{flex:1;overflow:auto;min-height:0}
.rz{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,var(--dim) 50%)}
#bar{position:fixed;left:0;right:0;bottom:0;height:34px;background:#0a0b0d;border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 8px;z-index:8000}
#bar .task{border:1px solid var(--line);padding:2px 10px;cursor:pointer;color:var(--dim);background:none;font:inherit}
#bar .task.on{color:var(--amber);border-color:var(--amber)}
#tasks .task{flex:0 1 auto;min-width:34px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chip,#net,#clock,#pwr,#bat{flex:none}
#bat{color:var(--dim);font-size:11px;letter-spacing:1px;padding:2px 8px;border:1px solid var(--line);cursor:pointer;white-space:nowrap}
#bat:hover{border-color:var(--amber)}#bat.lo{color:var(--red);border-color:var(--red);animation:bl 1s steps(2) infinite}#bat.ch{color:var(--green)}
#bar .sp{flex:1}
#net{color:var(--red);letter-spacing:1px;font-size:11px;cursor:pointer}
#net:before{content:"";display:inline-block;width:7px;height:7px;background:var(--red);margin-right:6px;animation:bl 1.2s steps(2) infinite}
@keyframes bl{50%{opacity:.2}}
#clock{color:var(--dim);min-width:120px;text-align:right}
/* terminal */
.term{padding:10px;height:100%;overflow:auto;background:#050607;color:var(--green);cursor:text}
.term .o{white-space:pre-wrap;word-break:break-word}
.term .e{color:var(--red)} .term .d{color:var(--dim)} .term .a{color:var(--amber)}
.term .pr{display:flex;gap:8px}
.term .pr span{color:var(--amber);white-space:nowrap}
.term input{flex:1;background:none;border:0;outline:0;color:var(--ink);font:inherit;caret-color:var(--amber)}
/* files */
.files{display:flex;flex-direction:column;height:100%}
.fpath{padding:6px 10px;border-bottom:1px solid var(--line);color:var(--amber);display:flex;gap:8px;align-items:center}
.fpath em{flex:1;font-style:normal}
.btn{background:none;border:1px solid var(--line);color:var(--ink);padding:1px 8px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--amber);color:var(--amber)}
.flist{flex:1;overflow:auto}
.row{display:flex;gap:10px;padding:4px 10px;cursor:pointer;border-bottom:1px solid #15181c}
.row:hover{background:rgba(255,176,0,.07)}
.row .n{flex:1}.row .s{color:var(--dim)}.row .x{color:var(--dim)}.row .x:hover{color:var(--red)}
.dir{color:var(--amber)}
/* notes */
.notes{display:flex;flex-direction:column;height:100%}
.notes .h{display:flex;gap:8px;padding:6px;border-bottom:1px solid var(--line)}
.notes input{flex:1;background:#050607;border:1px solid var(--line);color:var(--ink);padding:2px 8px;font:inherit;outline:0}
.notes textarea{flex:1;background:#050607;color:var(--ink);border:0;outline:0;padding:10px;font:inherit;resize:none;caret-color:var(--amber)}
.notes .st{padding:3px 10px;color:var(--dim);border-top:1px solid var(--line);font-size:11px}
/* monitor / net */
.pad{padding:12px}
.meter{margin:6px 0 12px}
.meter div.l{display:flex;justify-content:space-between;color:var(--dim);font-size:11px}
.meter div.b{height:8px;background:#15181c;margin-top:2px}
.meter div.b i{display:block;height:100%;background:var(--amber);width:0;transition:width .6s steps(6)}
.radar{display:block;margin:6px auto}
.red{color:var(--red)} .am{color:var(--amber)} .dm{color:var(--dim)}
.tb button:not(.cl):hover{background:var(--amber);border-color:var(--amber)}
#chip{position:relative;cursor:pointer;border:1px solid var(--line);padding:2px 10px;color:var(--amber);overflow:hidden;user-select:none}
#chip:hover{border-color:var(--amber)}
#chip i{position:absolute;left:0;bottom:0;height:2px;background:var(--amber);width:0;transition:width .5s}
#pwr{margin-left:4px}
.toast{position:fixed;right:16px;bottom:48px;z-index:9500;background:#17120a;border:1px solid var(--amber);color:var(--amber);padding:8px 14px;box-shadow:6px 6px 0 rgba(0,0,0,.6);animation:tin .25s steps(5)}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:10100;display:flex;align-items:center;justify-content:center}
.auth{position:fixed;inset:0;z-index:10000;background:radial-gradient(ellipse at 50% 110%,#1a1408 0,#050607 60%);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.abox{width:360px;max-width:100%;border:1px solid var(--amber);background:var(--panel);padding:22px;box-shadow:10px 10px 0 rgba(0,0,0,.6)}
.abox h2{color:var(--amber);font-weight:400;font-size:22px;letter-spacing:3px;margin-bottom:2px}
.abox .sub{color:var(--dim);margin-bottom:16px;font-size:12px}
.abox label{display:block;color:var(--dim);font-size:11px;letter-spacing:2px;margin:10px 0 3px}
.abox input{width:100%;background:#050607;border:1px solid var(--line);color:var(--ink);padding:7px 9px;font:inherit;outline:0}
.abox input:focus{border-color:var(--amber)}
.abox .pw{display:flex;gap:6px}.abox .pw .btn{white-space:nowrap}
.abox .err{color:var(--red);min-height:20px;margin-top:10px;font-size:12px}
.abox .go{width:100%;margin-top:6px;padding:8px;background:var(--amber);color:#000;border-color:var(--amber);font-weight:700;letter-spacing:2px}
.abox .go:disabled{opacity:.45;cursor:not-allowed}
.abox .fine{color:var(--dim);font-size:11px;margin-top:14px;line-height:1.5}
.abox a{color:var(--dim);cursor:pointer;text-decoration:underline}.abox a:hover{color:var(--red)}
@keyframes shk{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}.abox.shk{animation:shk .35s}
.modal .box{background:var(--panel);border:1px solid var(--amber);padding:16px;min-width:300px;max-width:90vw;box-shadow:8px 8px 0 rgba(0,0,0,.6)}
.modal .mt{margin-bottom:10px;color:var(--ink)}
.modal input{width:100%;background:#050607;border:1px solid var(--line);color:var(--ink);padding:4px 8px;font:inherit;outline:0;margin-bottom:10px}
.modal .mr{display:flex;gap:8px;flex-wrap:wrap}
.modal .mr .btn{padding:3px 12px}
.prof h4{margin:14px 0 6px;color:var(--dim);font-size:11px;letter-spacing:2px;font-weight:400}
.ph{display:flex;gap:14px;align-items:center}
.av{width:64px;height:64px;border:1px solid var(--amber);display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--amber);background:#17120a}
.pn{font-size:18px;color:var(--amber)} .pt{color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.grid div{border:1px solid var(--line);padding:6px 8px}
.grid b{display:block;color:var(--amber);font-size:16px;font-weight:400}
.grid span{color:var(--dim);font-size:11px}
.avs,.nm{display:flex;gap:6px;align-items:center}
.avs .btn{font-size:18px;width:36px;height:36px;padding:0;color:var(--amber)}
.avs .btn.sel{border-color:var(--amber);background:#17120a}
.nm input{flex:1;margin:0}
.nm input,.prof textarea{background:#050607;border:1px solid var(--line);color:var(--ink);padding:4px 8px;font:inherit;outline:0}
.prof textarea{width:100%;height:80px;margin-top:8px;resize:vertical}
.ach div{padding:4px 8px;border:1px solid var(--line);margin-bottom:4px;display:flex;justify-content:space-between;gap:10px}
.ach div.on{border-color:var(--amber);color:var(--amber)}
.ach div.off{color:#4a473f}
/* music */
.mus .mt1{font-size:16px;color:var(--amber);min-height:22px}
.mus canvas{display:block;width:100%;height:70px;background:#050607;border:1px solid var(--line);margin:8px 0}
.pgb{height:8px;background:#15181c;cursor:pointer;position:relative}.pgb i{display:block;height:100%;background:var(--amber);width:0}
.tms{display:flex;justify-content:space-between;font-size:11px;margin:3px 0 8px}
.mc{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.mc input{accent-color:var(--amber);width:90px}
.mc .btn.on{border-color:var(--amber);color:var(--amber)}
.ml{border:1px solid var(--line);max-height:170px;overflow:auto}.ml .row.cur{background:rgba(255,176,0,.1);color:var(--amber)}
.fine2{font-size:11px;margin-top:10px;line-height:1.5}
#mbtn{flex:none;font-size:15px;padding:0 10px}#mbtn.pl{color:var(--amber);border-color:var(--amber);animation:bl 1s steps(2) infinite}
/* settings */
.set{display:flex;flex-direction:column;height:100%}
.set .sh{display:flex;gap:8px;align-items:center;padding:6px;border-bottom:1px solid var(--line)}
.set .sq{flex:1;background:#050607;border:1px solid var(--line);color:var(--ink);padding:3px 8px;font:inherit;outline:0}
.set .stabs{display:flex;gap:4px;flex-wrap:wrap;padding:6px;border-bottom:1px solid var(--line)}
.set .stabs .btn.on{border-color:var(--amber);color:var(--amber);background:#17120a}
.set .sl{flex:1;overflow:auto}
.set .sf{display:flex;gap:6px;padding:6px;border-top:1px solid var(--line)}
.srow{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:6px 10px;border-bottom:1px solid #15181c}
.srow .sn{flex:1;min-width:0}.srow .sn small{display:block;color:var(--dim);font-size:11px}
.srow .sc2{display:flex;gap:8px;align-items:center}
.srow select,.srow input[type=text]{background:#050607;border:1px solid var(--line);color:var(--ink);padding:2px 6px;font:inherit;outline:0;max-width:150px}
.srow input[type=range]{accent-color:var(--amber);width:120px}
.tgl{min-width:48px;background:none;border:1px solid var(--line);color:var(--dim);font:inherit;cursor:pointer;padding:1px 6px}
.tgl.on{border-color:var(--amber);color:#000;background:var(--amber)}
.tgl:disabled{opacity:.6;cursor:not-allowed}
.sgh{padding:6px 10px;color:var(--amber);font-size:11px;letter-spacing:2px;background:#0a0b0d;position:sticky;top:0}
/* calculator */
.calc{width:100%}.calc .ch{min-height:18px;color:var(--dim);font-size:11px;text-align:right;overflow:hidden;white-space:nowrap}
.calc .cd{font-size:26px;text-align:right;color:var(--amber);padding:4px 6px;border:1px solid var(--line);background:#050607;margin-bottom:8px;overflow:hidden}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.cg button{background:#0a0b0d;border:1px solid var(--line);color:var(--ink);padding:10px 0;font:inherit;font-size:15px;cursor:pointer}
.cg button:hover{border-color:var(--amber);color:var(--amber)}.cg button.op{color:var(--amber)}.cg button.eq{background:var(--amber);color:#000}
/* clock */
.ctabs{display:flex;gap:6px;margin-bottom:12px}.ctabs .btn.on{border-color:var(--amber);color:var(--amber)}
.big{font-size:34px;color:var(--amber);letter-spacing:2px;text-align:center;margin:10px 0}
.crow{display:flex;gap:6px;justify-content:center;margin:8px 0;align-items:center}
.crow input{width:60px;background:#050607;border:1px solid var(--line);color:var(--ink);padding:3px 6px;font:inherit;outline:0;text-align:center}
.laps{max-height:120px;overflow:auto;color:var(--dim)}
/* games */
.gwrap{text-align:center}.gwrap canvas{display:block;margin:8px auto;border:1px solid var(--line);background:#050607;max-width:100%}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:6px}
.mg{display:grid;gap:2px;justify-content:center}
.mg button{width:28px;height:28px;background:#0a0b0d;border:1px solid var(--line);color:var(--ink);font:inherit;cursor:pointer;padding:0;line-height:1}
.mg button.o{background:#15181c;border-color:#15181c;cursor:default}.mg button.m{background:var(--red);color:#000}.mg button.f{color:var(--amber)}
.n1{color:#4de1ff}.n2{color:#7dff9b}.n3{color:#ff4d3d}.n4{color:#ff5fd2}.n5,.n6,.n7,.n8{color:#ffb000}
/* paint */
.paint{display:flex;flex-direction:column;height:100%}.paint .pt2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px;border-bottom:1px solid var(--line)}
.sw{width:18px;height:18px;border:1px solid var(--line);cursor:pointer;padding:0}.sw.sel{outline:2px solid var(--amber);outline-offset:1px}
.paint .cvw{flex:1;overflow:auto;padding:6px;background:#050607}.paint canvas{background:#050607;border:1px solid var(--line);cursor:crosshair;touch-action:none}
/* synth */
.keys{position:relative;height:130px;margin:10px auto;width:max-content}
.wk{display:inline-block;width:42px;height:130px;background:#d8d2c0;border:1px solid #000;color:#000;vertical-align:top;cursor:pointer;font:inherit;font-size:11px;padding-top:100px}
.wk.dn{background:var(--amber)}
.bk2{position:absolute;top:0;width:26px;height:80px;background:#050607;border:1px solid var(--line);cursor:pointer;color:var(--dim);font:inherit;font-size:10px;padding-top:56px;z-index:2}
.bk2.dn{background:var(--amber);color:#000}
/* calendar */
.cal .ch2{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cgd{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.cgd .dh{color:var(--dim);font-size:11px;text-align:center}
.cgd button{background:#0a0b0d;border:1px solid var(--line);color:var(--ink);padding:8px 0;font:inherit;cursor:pointer;position:relative}
.cgd button:hover{border-color:var(--amber)}.cgd button.td{border-color:var(--amber);color:var(--amber)}.cgd button.hn:after{content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;background:var(--red)}
.cgd span{display:block}
/* task manager */
.tm table{width:100%;border-collapse:collapse}.tm td,.tm th{padding:3px 8px;border-bottom:1px solid #15181c;text-align:left;font-weight:400}.tm th{color:var(--dim);font-size:11px}
.tm h4{color:var(--dim);font-size:11px;letter-spacing:2px;font-weight:400;margin:10px 0 4px}
/* browser */
.brw{display:flex;flex-direction:column;height:100%}.brw .ab{display:flex;gap:6px;padding:6px;border-bottom:1px solid var(--line)}
.brw .ab input{flex:1;background:#050607;border:1px solid var(--line);color:var(--ink);padding:3px 8px;font:inherit;outline:0}
.brw .pg{flex:1;overflow:auto;padding:16px}.brw a{color:var(--amber);cursor:pointer;text-decoration:underline}
/* netscan */
.ns{display:flex;flex-direction:column;height:100%}.ns .nt{display:flex;gap:4px;padding:6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ns .nt .btn.on{border-color:var(--amber);color:var(--amber);background:#17120a}.ns .nb{flex:1;overflow:auto;padding:10px}
.ns .nf2{padding:3px 10px;border-top:1px solid var(--line);color:var(--dim);font-size:11px}
.ns canvas{display:block;margin:6px auto;max-width:100%}.ns input[type=text]{background:#050607;border:1px solid var(--line);color:var(--ink);padding:2px 6px;font:inherit;outline:0}
.ns pre{white-space:pre-wrap;color:var(--green);font:inherit}.nrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.ns input[type=range]{accent-color:var(--amber)}
</style>
</head>
<body>
<div id="boot"></div>
<div id="desk">
  <div class="icons" id="icons"></div>
  <div id="mark">LAGGER<small>AIR-GAPPED / NO UPLINK / NO WORLD</small></div>
</div>
<div id="bar"><span id="tasks" style="display:flex;gap:6px;min-width:0;overflow:hidden"></span><span class="sp"></span><span id="bat" title="Battery">BAT …</span><button class="task" id="mbtn" title="Music">♫</button><span id="chip" title="Open profile"></span><span id="net" title="Click to scan">UPLINK: SEVERED</span><span id="clock"></span><button class="task" id="pwr" title="Power">⏻</button></div>
<div id="scan"></div>

<script>
/* ============ LaggerOS ============ */
const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const KEY='laggeros.fs.v1';
const bootTime=Date.now();

/* ---------- virtual filesystem (persisted, local only) ---------- */
const defaultFS=()=>({t:'d',c:{
  home:{t:'d',c:{
    lagger:{t:'d',c:{
      'readme.txt':{t:'f',d:'Welcome to LaggerOS.\n\nThis machine has no network stack. There is no sync, no cloud,\nno telemetry, no updates. Whatever you write here stays here.\n\nTry the terminal: type "help".'},
      docs:{t:'d',c:{}},
      'journal.txt':{t:'f',d:'Day 1. The silence is loud. Nothing is watching.'}
    }}
  }},
  etc:{t:'d',c:{
    'hostname':{t:'f',d:'lagger'},
    'network.conf':{t:'f',d:'# interfaces: none\n# routes: none\n# dns: none\nuplink=severed\n'},
    'motd':{t:'f',d:'You are offline. That is the feature.'}
  }},
  sys:{t:'d',c:{'kernel.log':{t:'f',d:'[0.000] lagger-kernel 0.1 booting\n[0.004] net: stack disabled at compile time\n[0.011] radios: removed\n'}}}
}});
/* storage on this laptop (browser local storage); falls back to memory if the browser blocks it */
const mem={};let PERSIST=true;
const store={ok:true,
  get(k){if(k in mem)return mem[k];try{return localStorage.getItem(k)}catch(e){this.ok=false;return mem[k]??null}},
  set(k,v){if(!PERSIST&&k!=='laggeros.cfg.v1'&&k!=='laggeros.acct.v1'){mem[k]=v;return}try{localStorage.setItem(k,v);delete mem[k]}catch(e){this.ok=false;mem[k]=v}},
  del(k){try{localStorage.removeItem(k)}catch(e){this.ok=false;delete mem[k]}}};
try{localStorage.setItem('__t','1');localStorage.removeItem('__t')}catch(e){store.ok=false}
let FS; try{FS=JSON.parse(store.get(KEY))||defaultFS()}catch(e){FS=defaultFS()}
const save=()=>store.set(KEY,JSON.stringify(FS));
const countNodes=(n=FS)=>n.t==='f'?1:1+Object.values(n.c).reduce((a,x)=>a+countNodes(x),0);
const parts=p=>p.split('/').filter(Boolean);
function norm(cwd,p){
  const base=p.startsWith('/')?[]:parts(cwd);
  for(const x of parts(p)){ if(x==='.')continue; if(x==='..')base.pop(); else base.push(x); }
  return '/'+base.join('/');
}
function node(path){
  let n=FS; for(const x of parts(path)){ if(!n||n.t!=='d'||!(x in n.c))return null; n=n.c[x]; } return n;
}
function parentOf(path){const ps=parts(path);const name=ps.pop();return {dir:node('/'+ps.join('/')),name}}
const size=n=>n.t==='f'?n.d.length:Object.values(n.c).reduce((a,x)=>a+size(x),0);

/* ---------- window manager ---------- */
let z=10,wins=[],focused=null;
function openWin(title,content,{w=520,h=340,x,y}={}){
  const win=el('div','win');
  const tb=el('div','tb',`<span class="t">${esc(title)}</span>`);
  const mn=el('button','','–'),mx=el('button','','□'),close=el('button','cl','×');
  mn.title='minimize';mx.title='maximize';close.title='close';
  tb.append(mn,mx,close);
  const body=el('div','body'); body.append(content);
  const rz=el('div','rz');
  win.append(tb,body,rz);
  win.style.width=w+'px';win.style.height=h+'px';
  const n=wins.length;
  win.style.left=(x??(215+n*28)%Math.max(240,innerWidth-w-40))+'px';
  win.style.top=(y??(40+n*26)%Math.max(100,innerHeight-h-80))+'px';
  $('#desk').append(win);
  const task=el('button','task',esc(title));
  $('#tasks').append(task);
  const o={win,task,title};
  wins.push(o);
  const focus=()=>{wins.forEach(k=>{k.win.classList.remove('focus');k.task.classList.remove('on')});win.classList.add('focus');task.classList.add('on');win.style.zIndex=++z;focused=o};
  win.addEventListener('mousedown',focus);
  win.addEventListener('mouseenter',()=>{if(CFG.ffm&&focused!==o&&win.style.display!=='none')focus()});
  o.focus=focus;
  task.onclick=()=>{
    if(win.style.display==='none'){win.style.display='';focus()}
    else if(focused===o){win.style.display='none';task.classList.remove('on')}
    else focus();
  };
  mn.onclick=e=>{e.stopPropagation();win.style.display='none';task.classList.remove('on')};
  mx.onclick=e=>{
    e&&e.stopPropagation();
    if(win.dataset.max){const g=JSON.parse(win.dataset.max);Object.assign(win.style,g);delete win.dataset.max}
    else{
      win.dataset.max=JSON.stringify({left:win.style.left,top:win.style.top,width:win.style.width,height:win.style.height});
      const d=$('#desk');Object.assign(win.style,{left:'0px',top:'0px',width:d.clientWidth+'px',height:d.clientHeight+'px'});
    }
    focus();
  };
  tb.addEventListener('dblclick',e=>{if(CFG.dbl&&e.target.tagName!=='BUTTON')mx()});
  close.onclick=e=>{e.stopPropagation();win.remove();task.remove();wins=wins.filter(k=>k!==o);if(focused===o)focused=null;o.onclose&&o.onclose()};
  tb.addEventListener('mousedown',e=>{
    if(e.target.tagName==='BUTTON')return;
    if(win.dataset.max)return;
    const sx=e.clientX-win.offsetLeft,sy=e.clientY-win.offsetTop;
    const mv=ev=>{win.style.left=Math.max(0,ev.clientX-sx)+'px';win.style.top=Math.max(0,Math.min(innerHeight-70,ev.clientY-sy))+'px'};
    const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up)};
    addEventListener('mousemove',mv);addEventListener('mouseup',up);e.preventDefault();
  });
  rz.addEventListener('mousedown',e=>{
    const sw=win.offsetWidth,sh=win.offsetHeight,sx=e.clientX,sy=e.clientY;
    const mv=ev=>{win.style.width=Math.max(260,sw+ev.clientX-sx)+'px';win.style.height=Math.max(140,sh+ev.clientY-sy)+'px'};
    const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up)};
    addEventListener('mousemove',mv);addEventListener('mouseup',up);e.preventDefault();e.stopPropagation();
  });
  focus();
  return o;
}

function modal(text,{input=false,def='',ok='OK',cancel=true,buttons=null}={},cb){
  const ov=el('div','modal'),bx=el('div','box'),mt=el('div','mt');mt.textContent=text;bx.append(mt);
  let inp;if(input){inp=el('input');inp.value=def;inp.spellcheck=false;bx.append(inp)}
  const row=el('div','mr');bx.append(row);ov.append(bx);document.body.append(ov);
  const close=()=>ov.remove();
  if(buttons){buttons.forEach(([l,f])=>{const b=el('button','btn',l);b.onclick=()=>{close();f&&f()};row.append(b)})}
  else{const b=el('button','btn',ok);b.onclick=()=>{close();cb&&cb(inp?inp.value:true)};row.append(b)}
  if(cancel){const c=el('button','btn','cancel');c.onclick=close;row.append(c)}
  ov.addEventListener('mousedown',e=>{if(e.target===ov)close()});
  ov.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Enter'&&inp){close();cb&&cb(inp.value)}});
  setTimeout(()=>(inp||row.firstChild).focus(),20);
}
const ask=(text,def,cb)=>modal(text,{input:true,def},cb);

/* ---------- profile / levels (saved on this laptop) ---------- */
const PKEY='laggeros.profile.v1';
const defP=()=>({name:'lagger',avatar:'◉',xp:0,cmds:0,files:0,saves:0,sweeps:0,netfails:0,boots:0,minutes:0,created:Date.now(),ach:{}});
let P;try{P=Object.assign(defP(),JSON.parse(store.get(PKEY)||'{}'))}catch(e){P=defP()}
if(!P.ach||typeof P.ach!=='object')P.ach={};
const saveP=()=>store.set(PKEY,JSON.stringify(P));
const levelOf=xp=>{let L=1;while(xp>=25*(L+1)*L)L++;return L};
const lvBase=L=>25*L*(L-1), lvNext=L=>25*L*(L+1);
const TITLES=['Drifter','Lurker','Static','Operator','Hermit','Archivist','Cipher','Warden','Sovereign','Void Walker'];
const titleOf=L=>TITLES[Math.min(L,TITLES.length)-1];
const AVS=['◉','▲','◆','✦','☠','⌬','☯','⚑'];
const ACH=[
 {id:'boot',n:'First Silence',d:'Boot LaggerOS',f:p=>p.boots>=1},
 {id:'c10',n:'Shell Dweller',d:'Run 10 commands',f:p=>p.cmds>=10},
 {id:'c100',n:'Daemon',d:'Run 100 commands',f:p=>p.cmds>=100},
 {id:'f5',n:'Hoarder',d:'Create 5 files or folders',f:p=>p.files>=5},
 {id:'nf',n:'Knocking on Nothing',d:'Try to reach the network',f:p=>p.netfails>=1},
 {id:'sv',n:'Diarist',d:'Save 3 notes',f:p=>p.saves>=3},
 {id:'sw',n:'Radar Watcher',d:'Watch 3 radar sweeps',f:p=>p.sweeps>=3},
 {id:'m30',n:'Long Offline',d:'Spend 30 minutes offline',f:p=>p.minutes>=30},
 {id:'l5',n:'Hermit',d:'Reach level 5',f:p=>levelOf(p.xp)>=5}
];
const profSubs=new Set();
function refreshProfile(){
  const L=levelOf(P.xp),pct=Math.min(100,(P.xp-lvBase(L))/(lvNext(L)-lvBase(L))*100);
  const c=$('#chip');if(c)c.innerHTML=`${esc(P.avatar)} ${esc(P.name)} · Lv ${L}<i style="width:${pct}%"></i>`;
  profSubs.forEach(f=>f());
}
function addXP(n){
  const before=levelOf(P.xp);P.xp+=n;const after=levelOf(P.xp);
  if(after>before)toast(`LEVEL UP → ${after} · ${titleOf(after)}`);
  ACH.forEach(a=>{if(!P.ach[a.id]&&a.f(P)){P.ach[a.id]=Date.now();toast('Badge unlocked: '+a.n)}});
  saveP();refreshProfile();
}
function creditFiles(before){const d=countNodes()-before;if(d>0){P.files+=d;addXP(5*d)}}
function onBoot(){P.boots++;addXP(10);if(P.boots>1)toast(`welcome back, ${P.name}. still offline.`)}
function onSweep(){P.sweeps++;addXP(1)}
setInterval(()=>{P.minutes++;addXP(1)},60000);

function appTerminal(){
  const t=el('div','term');
  let cwd='/home/lagger',hist=[],hi=0;
  const out=(s,c='o')=>{if(c==='e'&&CFG.tbell)beep(180,.12,'sawtooth');const d=el('div','o '+c);d.textContent=s;t.insertBefore(d,pr)};
  const pr=el('div','pr');
  const ps=el('span');const inp=el('input');inp.spellcheck=false;inp.autocomplete='off';
  pr.append(ps,inp);t.append(pr);
  const upd=()=>{
    const path=cwd==='/home/lagger'?'~':cwd,h=CFG.host||'lagger';
    ps.textContent={classic:`${h}@void:${path}$`,minimal:'$',arrow:`${path} ❯`,root:`root@${h}:${path}#`}[CFG.prompt]||`${h}@void:${path}$`;
  };
  upd();
  out('LaggerOS shell. Type "help". There is nothing out there.','d');
  t.addEventListener('click',()=>inp.focus());
  const cmds={
    help(){return `commands:
  ls [path]  cd <path>  pwd  cat <file>  mkdir <dir>  touch <file>
  rm <path>  echo <text> [> file]  write <file> <text>  cp <a> <b>  mv <a> <b>
  tree  du  clear  date  uptime  whoami  hostname  neofetch  battery
  ping|curl|wget|ssh|ifconfig|netstat   (try them)
  open <app>  apps (list apps)  profile  reset  lag <ms>`},
    profile(){const L=levelOf(P.xp);return `${P.avatar} ${P.name}  ·  Lv ${L} ${titleOf(L)}\nxp ${P.xp} (next level at ${lvNext(L)})\ncommands ${P.cmds}  files ${P.files}  notes ${P.saves}  badges ${Object.keys(P.ach).length}/${ACH.length}\n"open profile" for the full view.`},
    pwd(){return cwd},
    whoami(){return P.name},
    hostname(){return CFG.host||'lagger'},
    date(){return new Date().toString()},
    uptime(){const s=Math.floor((Date.now()-bootTime)/1000);return `up ${Math.floor(s/60)}m ${s%60}s, 0 connections, 0 packets ever sent`},
    clear(){[...t.querySelectorAll('.o')].forEach(x=>x.remove());return null},
    ls(a){const n=node(norm(cwd,a[0]||'.'));if(!n)return ['ls: no such path','e'];
      if(n.t==='f')return a[0];
      const k=Object.keys(n.c).sort();return k.length?k.map(x=>n.c[x].t==='d'?x+'/':x).join('  '):'(empty)'},
    cd(a){const p=norm(cwd,a[0]||'/home/lagger');const n=node(p);if(!n||n.t!=='d')return ['cd: not a directory','e'];cwd=p;upd();return null},
    cat(a){if(!a[0])return ['cat: missing file','e'];const n=node(norm(cwd,a[0]));if(!n)return ['cat: no such file','e'];if(n.t==='d')return ['cat: is a directory','e'];return n.d},
    mkdir(a){if(!a[0])return ['mkdir: missing name','e'];const{dir,name}=parentOf(norm(cwd,a[0]));if(!dir||dir.t!=='d')return ['mkdir: bad path','e'];if(name in dir.c)return ['mkdir: exists','e'];dir.c[name]={t:'d',c:{}};save();return null},
    touch(a){if(!a[0])return ['touch: missing name','e'];const{dir,name}=parentOf(norm(cwd,a[0]));if(!dir||dir.t!=='d')return ['touch: bad path','e'];if(!(name in dir.c))dir.c[name]={t:'f',d:''};save();return null},
    rm(a){if(!a[0])return ['rm: missing path','e'];const p=norm(cwd,a[0]);if(p==='/')return ['rm: no.','e'];const{dir,name}=parentOf(p);if(!dir||!(name in dir.c))return ['rm: no such path','e'];delete dir.c[name];save();return null},
    write(a){if(a.length<2)return ['write: write <file> <text>','e'];const{dir,name}=parentOf(norm(cwd,a[0]));if(!dir||dir.t!=='d')return ['write: bad path','e'];dir.c[name]={t:'f',d:a.slice(1).join(' ')};save();return null},
    echo(a){const i=a.indexOf('>');if(i<0)return a.join(' ');const txt=a.slice(0,i).join(' '),f=a[i+1];if(!f)return ['echo: missing target','e'];return cmds.write([f,txt])},
    cp(a){if(a.length<2)return ['cp: cp <a> <b>','e'];const s=node(norm(cwd,a[0]));if(!s||s.t!=='f')return ['cp: source must be a file','e'];const{dir,name}=parentOf(norm(cwd,a[1]));if(!dir)return ['cp: bad target','e'];dir.c[name]={t:'f',d:s.d};save();return null},
    mv(a){const r=cmds.cp(a);if(r)return r;return cmds.rm([a[0]])},
    tree(){const l=[];const w=(n,p)=>Object.keys(n.c).sort().forEach((k,i,arr)=>{const last=i===arr.length-1;l.push(p+(last?'└─ ':'├─ ')+k+(n.c[k].t==='d'?'/':''));if(n.c[k].t==='d')w(n.c[k],p+(last?'   ':'│  '))});l.push('/');w(node(cwd),'');return l.join('\n')},
    du(){return size(FS)+' bytes used. all of it yours.'},
    neofetch(){return `   _                            ${'lagger@void'}
  | |    __ _  __ _  __ _  ___ _ __   ----------
  | |   / _\` |/ _\` |/ _\` |/ _ \\ '__|  OS: LaggerOS 0.1 (air-gapped)
  | |__| (_| | (_| | (_| |  __/ |     Kernel: lagger-kernel 0.1
  |_____\\__,_|\\__, |\\__, |\\___|_|     Uptime: ${Math.floor((Date.now()-bootTime)/60000)} min
              |___/ |___/             Network: none. by design.
                                      Telemetry: does not exist
                                      Radios: removed`},
    ifconfig(){return 'lo0: flags=LOOPBACK  inet 127.0.0.1\n(no other interfaces. no antennae. no port.)'},
    netstat(){return 'Active connections: 0\nListening: 0\nEstablished: 0\nYou are alone.'},
    ping(a){return [`ping: ${a[0]||'host'}: Network is unreachable (there is no network)`,'e']},
    curl(a){return [`curl: (6) could not resolve host: ${a[0]||'?'}\nthe world is not available here.`,'e']},
    wget(a){return cmds.curl(a)},
    ssh(a){return ['ssh: connect: no route to anywhere','e']},
    apps(){return Object.keys(REG).join('  ')},
    battery(){
      if(!BAT.ready)return 'reading battery…';
      if(!BAT.ok)return ['battery: not available in this browser (try Chrome, Edge or Opera)','e'];
      const p=batPct(),n=Math.round(p/5);
      return `[${'█'.repeat(n)}${'░'.repeat(20-n)}] ${p}%\n${batStatusText()}`;
    },
    open(a){const f=REG[(a[0]||'').toLowerCase()];if(!f)return ['open: unknown app. try: '+Object.keys(REG).join(' | '),'e'];f();return null},
    reset(){store.del(KEY);FS=defaultFS();save();cwd='/home/lagger';upd();return 'filesystem wiped to factory state. (profile kept)'},
    lag(a){const v=parseInt(a[0]);if(isNaN(v)||v<0||v>3000)return ['lag: lag <0-3000> (ms of artificial latency)','e'];setCfg('lag',String(v));return `input latency set to ${v}ms. as the name demands.`}
  };
  inp.addEventListener('keydown',e=>{
    if(e.key==='ArrowUp'){if(hi>0)inp.value=hist[--hi]||'';e.preventDefault();return}
    if(e.key==='ArrowDown'){inp.value=hist[++hi]||'';e.preventDefault();return}
    if(e.key!=='Enter')return;
    const line=inp.value.trim();inp.value='';
    const run=()=>{
      out(ps.textContent+' '+line,'a');
      if(!line)return;
      hist.push(line);hi=hist.length;
      const a=line.split(/\s+/),c=a.shift();
      if(!cmds[c]){out(`${c}: command not found`,'e');}
      else{
        const before=countNodes();
        const r=cmds[c](a);if(r){Array.isArray(r)?out(r[0],r[1]):out(r)}
        P.cmds++;if(['ping','curl','wget','ssh','ifconfig','netstat'].includes(c))P.netfails++;
        creditFiles(before);addXP(2);
      }
      t.scrollTop=t.scrollHeight;
    };
    LAG?setTimeout(run,LAG):run();
  });
  const o=openWin('Terminal',t,{w:600,h:380});setTimeout(()=>inp.focus(),30);return o;
}

function appNotes(path){
  const w=el('div','notes');

  const sv=el('button','btn','save');h.append(pi,sv);

  const load=()=>{const n=node(norm('/',pi.value.trim()));ta.value=n&&n.t==='f'?n.d:'';st.textContent=n&&n.t==='f'?'opened':'new file — save to create it'};
  const doSave=()=>{
    const p=norm('/',pi.value.trim());const{dir,name}=parentOf(p);
    if(!name||!dir||dir.t!=='d'){st.textContent='bad path (folder must exist)';return}
    if(dir.c[name]&&dir.c[name].t==='d'){st.textContent='that path is a folder';return}
    const before=countNodes();
    dir.c[name]={t:'f',d:ta.value};save();pi.value=p;
    st.textContent=(store.ok?'saved on this laptop ':'saved (memory only) ')+new Date().toLocaleTimeString();
    P.saves++;creditFiles(before);addXP(5);
  };
  sv.onclick=doSave;pi.onchange=load;
  ta.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();doSave()}});
  load();
  const o=openWin('Notes',w,{w:480,h:340});
  const ms={'5s':5000,'15s':15000,'60s':60000}[CFG.autosave]||0;
  if(ms){
    let last=ta.value;
    const iv=setInterval(()=>{
      if(ta.value===last)return;
      const p=norm('/',pi.value.trim()),{dir,name}=parentOf(p);
      if(!name||!dir||dir.t!=='d'||(dir.c[name]&&dir.c[name].t==='d'))return;
      dir.c[name]={t:'f',d:ta.value};save();last=ta.value;st.textContent='autosaved '+new Date().toLocaleTimeString();
    },ms);
    onClose(o,()=>clearInterval(iv));
  }
  return o;
}

    save();creditFiles(before);addXP(0);draw();
  });
  nf.onclick=()=>mk('f');
  nd.onclick=()=>mk('d');
  draw();return openWin('Files',w,{w:420,h:330});

function appNetscan(){
  const w=el('div','ns');
  w.innerHTML=`<div class="nt"></div><div class="nb"></div><div class="nf2"></div>`;
  const nt=$('.nt',w),nb=$('.nb',w),nf=$('.nf2',w);
  const TABS=[['radar','Radar'],['spec','Spectrum'],['ports','Ports'],['trace','Trace'],['log','Log']];
  const LOG=[];let tab='radar',stop=null;
  const stamp=()=>new Date().toLocaleTimeString([],{hour12:false});
  const log=m=>{LOG.push(stamp()+'  '+m);if(LOG.length>300)LOG.shift()};
  const foot=m=>{nf.textContent=m};
  let sweeps=0,live=true;
  TABS.forEach(([k,l])=>{const b=el('button','btn',l);b.dataset.k=k;b.onclick=()=>show(k);nt.append(b)});
  function show(k){
    if(stop){stop();stop=null}
    tab=k;[...nt.children].forEach(b=>b.classList.toggle('on',b.dataset.k===k));
    nb.innerHTML='';
    ({radar,spec,ports,trace,logTab})[k==='log'?'logTab':k]();
  }

  /* ---- radar ---- */
  function radar(){
    nb.innerHTML=`<canvas width="240" height="240"></canvas><div class="msg am" style="text-align:center;min-height:36px">scanning 0.0 – 6.0 GHz…</div>
    <div class="nrow" style="justify-content:center"><button class="btn rp">pause</button><button class="btn dp">deep scan</button>
    <label class="dm">speed <input type="range" class="sp" min="1" max="12" value="5"></label><label class="dm"><input type="checkbox" class="ph" checked> phantoms</label></div>
    <div class="deep" style="text-align:center;min-height:18px"></div>`;
    const cv=$('canvas',nb),g=cv.getContext('2d'),msg=$('.msg',nb),deep=$('.deep',nb);
    let a=0,blips=[],paused=false,raf,run=true,deepLeft=0,deepTotal=0;
    const acc=accent();
    $('.rp',nb).onclick=e=>{paused=!paused;e.target.textContent=paused?'resume':'pause'};
    $('.dp',nb).onclick=()=>{if(deepLeft)return;deepTotal=deepLeft=5;log('deep scan started (5 sweeps, all bands)');deep.innerHTML='<span class="am">deep scan…</span>'};
    const frame=()=>{
      if(!run)return;
      const sp=Number($('.sp',nb).value)/100*(deepLeft?3:1);
      g.fillStyle='rgba(5,6,7,.16)';g.fillRect(0,0,240,240);
      g.strokeStyle='#2a2616';g.lineWidth=1;
      [30,60,90,115].forEach(r=>{g.beginPath();g.arc(120,120,r,0,7);g.stroke()});
      g.beginPath();g.moveTo(120,0);g.lineTo(120,240);g.moveTo(0,120);g.lineTo(240,120);g.stroke();
      if(!paused){
        a+=sp;
        if(a>6.283){
          a=0;sweeps++;P.sweeps++;addXP(1);
          const m=`sweep ${sweeps}: 0 carriers, 0 access points, 0 towers. nothing answers.`;
          msg.textContent=m;log(m);foot('sweeps this session: '+sweeps);
          if(deepLeft){deepLeft--;deep.innerHTML=deepLeft?`<span class="am">deep scan… ${deepTotal-deepLeft}/${deepTotal}</span>`:'<span class="red">deep scan complete: 0 signals across 5 bands. the silence is total.</span>';if(!deepLeft){log('deep scan complete: 0 signals');beep(330,.2,'triangle')}}
        }
        if($('.ph',nb).checked&&Math.random()<.006){
          const ang=Math.random()*6.283,rad=25+Math.random()*85;
          blips.push({x:120+Math.cos(ang)*rad,y:120+Math.sin(ang)*rad,life:1});
          const f=(Math.random()*6).toFixed(2);log(`phantom echo near ${f} GHz — dismissed (no hardware)`);
        }
      }
      g.strokeStyle=acc;g.lineWidth=2;g.beginPath();g.moveTo(120,120);g.lineTo(120+Math.cos(a)*115,120+Math.sin(a)*115);g.stroke();
      blips=blips.filter(b=>(b.life-=.004)>0);
      blips.forEach(b=>{g.fillStyle=`rgba(255,77,61,${b.life})`;g.beginPath();g.arc(b.x,b.y,3,0,7);g.fill()});
      raf=requestAnimationFrame(frame);
    };
    frame();stop=()=>{run=false;cancelAnimationFrame(raf)};
    foot('sweeps this session: '+sweeps);
  }

  /* ---- spectrum waterfall ---- */
  function spec(){
    nb.innerHTML=`<canvas width="360" height="220" style="cursor:crosshair"></canvas><div class="nrow" style="justify-content:center"><button class="btn rp">pause</button><span class="dm rd">hover for frequency</span></div><div class="dm" style="text-align:center">noise floor: −∞ dBm · every band is empty</div>`;
    const cv=$('canvas',nb),g=cv.getContext('2d'),rd=$('.rd',nb);
    const W=360,H=220,top=24;
    g.fillStyle='#050607';g.fillRect(0,0,W,H);
    let paused=false,iv;
    const bands=[['BT',2.4,2.48],['Wi-Fi 2.4',2.4,2.5],['Wi-Fi 5',5.15,5.85],['LTE',.7,2.6],['GPS',1.57,1.58]];
    const hex=accent();
    const tick=()=>{
      if(paused)return;
      const img=g.getImageData(0,top,W,H-top-1);g.putImageData(img,0,top+1);
      for(let x=0;x<W;x++){
        const v=Math.random()<.04?Math.random()*.5:Math.random()*.12;
        g.fillStyle=hex;g.globalAlpha=Math.min(1,v);g.fillRect(x,top,1,1);
      }
      g.globalAlpha=1;
      g.fillStyle='#050607';g.fillRect(0,0,W,top);
      g.fillStyle='#6f6c62';g.font='10px monospace';
      for(let f=0;f<=6;f++){const x=f/6*(W-1);g.fillRect(x,top-6,1,6);g.fillText(f+'G',Math.min(W-16,x+2),12)}
      g.strokeStyle='#2a2616';bands.forEach(([n,a,b])=>{g.strokeRect(a/6*W,top-3,Math.max(2,(b-a)/6*W),3)});
    };
    iv=setInterval(tick,90);
    $('.rp',nb).onclick=e=>{paused=!paused;e.target.textContent=paused?'resume':'pause'};
    cv.onmousemove=e=>{
      const r=cv.getBoundingClientRect(),f=((e.clientX-r.left)/r.width*6);
      const hit=bands.filter(([n,a,b])=>f>=a&&f<=b).map(b=>b[0]).join(', ');
      rd.textContent=f.toFixed(2)+' GHz'+(hit?'  ('+hit+' band)':'')+'  —  empty';
    };
    stop=()=>clearInterval(iv);
    log('spectrum analyzer opened');foot('waterfall: 0–6 GHz, resolution 17 MHz/px');
  }

  /* ---- ports ---- */
  function ports(){
    nb.innerHTML=`<div class="nrow">target <input type="text" class="tg" value="127.0.0.1" size="14"> ports <input type="text" class="a" value="1" size="4">–<input type="text" class="b" value="1024" size="5"> <button class="btn go">scan</button><button class="btn sub">scan subnet</button></div>
    <div class="meter" style="margin:6px 0"><div class="b"><i class="bar"></i></div></div><pre class="po">idle.</pre>`;
    const po=$('.po',nb),bar=$('.bar',nb);let iv=null;
    const done=()=>{clearInterval(iv);iv=null};
    $('.go',nb).onclick=()=>{
      done();
      let a=Math.max(1,parseInt($('.a',nb).value)||1),b=Math.min(65535,parseInt($('.b',nb).value)||1024);
      if(b<a)[a,b]=[b,a];if(b-a>5000)b=a+5000;
      const tg=$('.tg',nb).value.trim().slice(0,40)||'127.0.0.1';
      const n=b-a+1;let i=0;
      po.textContent=`scanning ${tg} ports ${a}-${b} …`;log(`port scan ${tg} ${a}-${b}`);
      iv=setInterval(()=>{
        i=Math.min(n,i+Math.ceil(n/40));bar.style.width=(i/n*100)+'%';
        if(i>=n){
          done();P.netfails++;addXP(2);
          const lo=/^(127\.|localhost)/.test(tg);
          const m=`scan of ${tg} complete\n  open: 0\n  closed: ${n}\n  filtered: 0\n${lo?'  note: loopback only — and nothing listens on it.':'  note: no route to host — there is no network stack.'}`;
          po.textContent=m;log(`port scan ${tg}: 0 open / ${n} closed`);beep(330,.15,'triangle');
        }else po.textContent=`scanning ${tg} … ${Math.floor(i/n*100)}% (${a+i-1})`;
      },60);
    };
    $('.sub',nb).onclick=()=>{
      done();let i=0;const N=254;po.textContent='sweeping 192.168.0.0/24 …';log('subnet sweep 192.168.0.0/24');
      iv=setInterval(()=>{
        i=Math.min(N,i+9);bar.style.width=(i/N*100)+'%';
        if(i>=N){done();P.netfails++;addXP(2);po.textContent='sweep complete\n  hosts up: 0 / 254\n  gateway: none\n  you are the only host on this network.';log('subnet sweep: 0 hosts up')}
        else po.textContent=`sweeping 192.168.0.${i} … no reply`;
      },50);
    };
    stop=done;foot('local ports only · no outbound traffic is ever sent');
  }

  /* ---- trace ---- */
  function trace(){
    nb.innerHTML=`<div class="nrow">host <input type="text" class="tg" value="example.com" size="22"> <button class="btn go">trace</button></div><pre class="po">idle.</pre>`;
    const po=$('.po',nb);let timers=[];
    stop=()=>timers.forEach(clearTimeout);
    $('.go',nb).onclick=()=>{
      timers.forEach(clearTimeout);timers=[];
      const h=$('.tg',nb).value.trim().slice(0,60)||'localhost';
      const lines=[`traceroute to ${h}, 30 hops max`,' 1  *  *  *   (no interface)',' 2  *  *  *   (no gateway)',' 3  *  *  *   (no ISP)',' 4  *  *  *   (no backbone)',' 5  *  *  *   (no world)','',`traceroute: ${h}: no route to anywhere`];
      po.textContent='';log('traceroute '+h);P.netfails++;addXP(1);
      lines.forEach((l,i)=>timers.push(setTimeout(()=>{po.textContent+=l+'\n';if(i)beep(260,.04,'square',.5)},i*(CFG.lag?Math.max(300,+CFG.lag):450))));
    };
    foot('every hop times out');
  }

  /* ---- log ---- */
  function logTab(){
    nb.innerHTML=`<div class="nrow"><button class="btn cl2">clear</button><button class="btn sv">save to /home/lagger/netscan.log</button></div><pre class="po" style="max-height:230px;overflow:auto"></pre>`;
    const po=$('.po',nb);
    const draw=()=>{po.textContent=LOG.length?LOG.join('\n'):'(no events yet. nothing has happened.)';po.scrollTop=po.scrollHeight};
    $('.cl2',nb).onclick=()=>{LOG.length=0;draw()};
    $('.sv',nb).onclick=()=>{
      const home=node('/home/lagger');const before=countNodes();
      home.c['netscan.log']={t:'f',d:LOG.join('\n')||'(empty)'};save();creditFiles(before);toast('saved netscan.log');
    };
    draw();const iv=setInterval(draw,1000);stop=()=>clearInterval(iv);
    foot(LOG.length+' events logged');
  }

  const o=openWin('Netscan',w,{w:420,h:470});
  show('radar');
  onClose(o,()=>{if(stop)stop()});
  return o;
}

let AC=null;
function beep(f=660,d=.06,type='square',vol=1){
  if(!CFG.sound||!Number(CFG.vol))return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=f;g.gain.value=(Number(CFG.vol)/100)*.25*vol;
    o.connect(g);g.connect(AC.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d+.02);
  }catch(e){}
}

      if(s.g!==last&&tab==='All'){list.append(el('div','sgh',s.g.toUpperCase()));last=s.g}
      const r=el('div','srow');const nm=el('div','sn');nm.append(document.createTextNode(s.l));

    q('.sc').textContent=n+'/'+SET.length;
  }
  q('.rs').onclick=()=>modal('Reset ALL settings to defaults?',{ok:'reset'},()=>{CFG=Object.assign({},CFGDEF);saveCfg();applyCfg();draw();toast('settings reset')});
  q('.ex').onclick=()=>{
    try{const a=el('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(CFG,null,1)],{type:'application/json'}));a.download='laggeros-settings.json';document.body.append(a);a.click();a.remove();toast('settings exported')}
    catch(e){toast('download blocked')}
  };
  q('.im').onclick=()=>ask('Paste settings JSON',' ',v=>{
    try{const o=JSON.parse(v);if(!o||typeof o!=='object')throw 0;
      SET.forEach(s=>{if(s.t==='lock'||!(s.id in o))return;
        let x=o[s.id];
        if(s.t==='tog')x=!!x;
        else if(s.t==='sel'){if(!s.o.includes(String(x)))return;x=String(x)}
        else if(s.t==='rng'){x=Math.min(s.max,Math.max(s.min,Number(x)));if(isNaN(x))return;x=String(x)}
        else if(s.t==='txt')x=String(x).replace(/[^\w\-]/g,'').slice(0,16)||s.d;
        CFG[s.id]=x});
      saveCfg();applyCfg();draw();toast('settings imported');
    }catch(e){toast('import failed: invalid JSON')}

/* ---------- Calculator ---------- */
function appCalc(){
  const w=el('div','pad calc');
  const hist=el('div','ch','&nbsp;'),disp=el('div','cd','0'),grid=el('div','cg');
  w.append(hist,disp,grid);
  let expr='';
  const show=()=>{disp.textContent=expr||'0'};
  const calc=()=>{
    const s=expr.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/%/g,'/100');
    if(!/^[0-9+\-*/.() ]+$/.test(s))throw 0;
    const r=Function('"use strict";return ('+s+')')();
    if(typeof r!=='number'||!isFinite(r))throw 0;
    return +r.toPrecision(12);
  };
  const isOp=c=>'+−×÷'.includes(c);
  function press(k){
    beep(900,.02,'square',.5);
    if(k==='C'){expr='';hist.innerHTML='&nbsp;'}
    else if(k==='⌫')expr=expr.slice(0,-1);
    else if(k==='='){
      if(!expr)return;
      try{const r=calc();hist.textContent=expr+' =';expr=String(r);addXP(1)}catch(e){hist.textContent='error';expr=''}
    }
    else if(k==='±')expr=expr.startsWith('-')?expr.slice(1):(expr?'-'+expr:expr);
    else if(isOp(k)){
      if(!expr){if(k==='−')expr='-';return show()}
      if(isOp(expr.slice(-1)))expr=expr.slice(0,-1);
      expr+=k;
    }
    else if(k==='%'){if(expr&&!isOp(expr.slice(-1)))expr+='%'}
    else expr+=k;
    if(expr.length>30)expr=expr.slice(0,30);
    show();
  }
  ['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±','0','.','='].forEach(k=>{
    const b=el('button',k==='='?'eq':'+−×÷'.includes(k)?'op':'',k);b.onclick=()=>press(k);grid.append(b);
  });
  const o=openWin('Calculator',w,{w:260,h:380});
  const map={'*':'×','/':'÷','-':'−','Enter':'=','=':'=','Backspace':'⌫','Escape':'C','Delete':'C'};
  kb(o,e=>{
    const k=map[e.key]||e.key;
    if(/^[0-9.+%]$/.test(k)||'×÷−=⌫C'.includes(k)&&k.length===1){e.preventDefault();press(k)}
  });
  return o;
}

/* ---------- Clock / Stopwatch / Timer ---------- */
function appClock(){
  const w=el('div','pad clk');
  w.innerHTML=`<div class="ctabs"><button class="btn" data-t="c">clock</button><button class="btn" data-t="s">stopwatch</button><button class="btn" data-t="t">timer</button></div><div class="cv"></div>`;
  const cv=$('.cv',w);let tab='c';
  const sw={run:false,start:0,acc:0,laps:[]};
  const tm={run:false,end:0,left:0,total:0};
  const fmt=ms=>{const t=Math.floor(ms/10),cs=t%100,s=Math.floor(t/100)%60,m=Math.floor(t/6000);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+String(cs).padStart(2,'0')};
  const fmtT=ms=>{const s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s/60)%60;return (h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
  const swNow=()=>sw.acc+(sw.run?Date.now()-sw.start:0);
  const tmNow=()=>tm.run?Math.max(0,tm.end-Date.now()):tm.left;
  function render(){
    [...$('.ctabs',w).children].forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
    cv.innerHTML='';
    if(tab==='c'){
      cv.innerHTML=`<div class="big" id="ck1"></div><div class="dm" style="text-align:center" id="ck2"></div><div class="dm" style="text-align:center;margin-top:10px" id="ck3"></div>`;
    }else if(tab==='s'){
      cv.innerHTML=`<div class="big" id="sw1">00:00.00</div><div class="crow"><button class="btn" id="sgo"></button><button class="btn" id="slap">lap</button><button class="btn" id="srs">reset</button></div><div class="laps" id="slaps"></div>`;
      const go=$('#sgo',w);
      const sync=()=>{go.textContent=sw.run?'stop':'start'};sync();
      go.onclick=()=>{if(sw.run){sw.acc+=Date.now()-sw.start;sw.run=false}else{sw.start=Date.now();sw.run=true}sync();beep(700,.03)};
      $('#slap',w).onclick=()=>{if(swNow()>0){sw.laps.unshift(fmt(swNow()));drawLaps()}};
      $('#srs',w).onclick=()=>{sw.run=false;sw.acc=0;sw.laps=[];sync();drawLaps()};
      drawLaps();
    }else{
      cv.innerHTML=`<div class="big" id="tm1"></div><div class="crow"><input id="tmin" type="number" min="0" max="999" value="5"> min <input id="tsec" type="number" min="0" max="59" value="0"> sec</div><div class="crow"><button class="btn" id="tgo"></button><button class="btn" id="trs">reset</button></div>`;
      const go=$('#tgo',w);
      const sync=()=>{go.textContent=tm.run?'pause':'start'};sync();
      go.onclick=()=>{
        if(tm.run){tm.left=tm.end-Date.now();tm.run=false}
        else{
          if(tm.left<=0){const t=(Math.max(0,+$('#tmin',w).value||0)*60+Math.min(59,Math.max(0,+$('#tsec',w).value||0)))*1000;if(!t)return;tm.total=t;tm.left=t}
          tm.end=Date.now()+tm.left;tm.run=true;
        }
        sync();beep(700,.03);
      };
      $('#trs',w).onclick=()=>{tm.run=false;tm.left=0;sync()};
    }
    tick();
  }
  function drawLaps(){const l=$('#slaps',w);if(l)l.innerHTML=sw.laps.map((x,i)=>`${String(sw.laps.length-i).padStart(2,'0')}  ${x}`).join('<br>')}
  function tick(){
    if(tab==='c'){
      const d=new Date(),a=$('#ck1',w);if(!a)return;
      a.textContent=d.toLocaleTimeString([],{hour12:!CFG.h24,hour:'2-digit',minute:'2-digit',second:'2-digit'});
      $('#ck2',w).textContent=d.toLocaleDateString([],{weekday:'long',year:'numeric',month:'long',day:'numeric'});
      $('#ck3',w).textContent='UTC '+d.toISOString().slice(11,19)+'  ·  offline for '+Math.floor((Date.now()-bootTime)/1000)+'s  ·  no NTP, trusting the local clock';
    }else if(tab==='s'){const e=$('#sw1',w);if(e)e.textContent=fmt(swNow())}
    else{
      const e=$('#tm1',w);if(!e)return;
      const l=tmNow();e.textContent=fmtT(tm.run||tm.left>0?l:0);
      if(tm.run&&l<=0){
        tm.run=false;tm.left=0;toast('timer finished');
        [0,200,400].forEach(t=>setTimeout(()=>beep(880,.15,'square',1.5),t));
        const g=$('#tgo',w);if(g)g.textContent='start';
      }
    }
  }
  $('.ctabs',w).onclick=e=>{const t=e.target.dataset&&e.target.dataset.t;if(t){tab=t;render()}};
  render();
  const iv=setInterval(tick,50);
  const o=openWin('Clock',w,{w:400,h:300});onClose(o,()=>clearInterval(iv));return o;
}

/* ---------- Snake ---------- */
function appSnake(){
  const N=20,SZ=16,HK='laggeros.snake.hi';
  const w=el('div','pad gwrap');
  const info=el('div','dm');const cv=el('canvas');cv.width=cv.height=N*SZ;
  w.append(info,cv,el('div','dm','arrows / WASD to steer · space pause · enter restart'));
  const g=cv.getContext('2d');
  let snake,dir,nd,food,score,alive,paused,timer,hi=Number(store.get(HK))||0;
  const place=()=>{let p;do{p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));food=p};
  const hud=()=>{info.textContent=`score ${score}   best ${hi}   ${!alive?'GAME OVER':paused?'PAUSED':''}`};
  function draw(){
    g.fillStyle='#050607';g.fillRect(0,0,N*SZ,N*SZ);
    g.fillStyle='#ff4d3d';g.fillRect(food.x*SZ+2,food.y*SZ+2,SZ-4,SZ-4);
    snake.forEach((s,i)=>{g.fillStyle=i?accent():'#fff';g.globalAlpha=i?Math.max(.4,1-i*.02):1;g.fillRect(s.x*SZ+1,s.y*SZ+1,SZ-2,SZ-2)});
    g.globalAlpha=1;hud();
  }
  function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir=nd={x:1,y:0};score=0;alive=true;paused=false;place();draw();loop()}
  function loop(){
    clearTimeout(timer);
    timer=setTimeout(()=>{step();if(alive)loop()},Math.max(55,125-score*3));
  }
  function step(){
    if(paused||!alive)return;
    dir=nd;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)){
      alive=false;beep(120,.3,'sawtooth');
      if(score>hi){hi=score;store.set(HK,String(hi));toast('new snake record: '+hi)}
      draw();return;
    }
    snake.unshift(h);
    if(h.x===food.x&&h.y===food.y){score++;addXP(1);beep(900,.05);place()}else snake.pop();
    draw();
  }
  reset();
  const o=openWin('Snake',w,{w:370,h:430});
  onClose(o,()=>clearTimeout(timer));
  kb(o,e=>{
    const m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]}[e.key];
    if(m){e.preventDefault();if(m[0]!==-dir.x||m[1]!==-dir.y)nd={x:m[0],y:m[1]}}
    else if(e.key===' '){e.preventDefault();if(alive){paused=!paused;draw()}}
    else if(e.key==='Enter'){reset()}
  });
  return o;
}

/* ---------- Minesweeper ---------- */
function appMines(){
  const ROWS=9,COLS=9,MINES=10;
  const w=el('div','pad');
  const hd=el('div','mh'),left=el('span'),fl=el('button','btn','flag: off'),face=el('button','btn','☺'),tmr=el('span');
  hd.append(left,fl,face,tmr);
  const gr=el('div','mg');gr.style.gridTemplateColumns=`repeat(${COLS},28px)`;
  w.append(hd,gr,el('div','dm','right-click or "flag" mode to plant flags'));
  let cells,over,started,t0,flagMode=false,iv,flags,opened;
  const nb=i=>{const r=Math.floor(i/COLS),c=i%COLS,o=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const rr=r+dr,cc=c+dc;if(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS)o.push(rr*COLS+cc)}return o};
  function init(){
    cells=Array.from({length:ROWS*COLS},()=>({m:0,o:0,f:0,n:0}));
    over=false;started=false;flags=0;opened=0;clearInterval(iv);tmr.textContent='000';face.textContent='☺';render();
  }
  const plant=safe=>{
    let p=0;while(p<MINES){const i=Math.floor(Math.random()*ROWS*COLS);if(i===safe||cells[i].m)continue;cells[i].m=1;p++}
    cells.forEach((c,i)=>c.n=nb(i).filter(j=>cells[j].m).length);
  };
  const reveal=i=>{
    const st=[i];
    while(st.length){const k=st.pop(),c=cells[k];if(c.o||c.f)continue;c.o=1;opened++;if(!c.n&&!c.m)nb(k).forEach(j=>st.push(j))}
  };
  function act(i,right){
    if(over)return;const c=cells[i];
    if(right||flagMode){if(!c.o){c.f=c.f?0:1;flags+=c.f?1:-1;beep(500,.02)}}
    else{
      if(c.f||c.o)return;
      if(!started){started=true;plant(i);t0=Date.now();iv=setInterval(()=>{tmr.textContent=String(Math.min(999,Math.floor((Date.now()-t0)/1000))).padStart(3,'0')},500)}
      if(c.m){over=true;clearInterval(iv);face.textContent='☹';cells.forEach(x=>{if(x.m)x.o=1});beep(110,.35,'sawtooth')}
      else{
        reveal(i);beep(800,.02);
        if(opened===ROWS*COLS-MINES){over=true;clearInterval(iv);face.textContent='★';addXP(15);toast('minefield cleared');beep(880,.12)}
      }
    }
    render();
  }
  function render(){
    left.textContent='mines '+String(MINES-flags).padStart(2,'0');gr.innerHTML='';
    cells.forEach((c,i)=>{
      const b=el('button');
      if(c.o){b.className='o';if(c.m){b.className='m';b.textContent='✹'}else if(c.n){b.textContent=c.n;b.classList.add('n'+c.n)}}
      else if(c.f){b.className='f';b.textContent='⚑'}
      b.onclick=()=>act(i,false);b.oncontextmenu=e=>{e.preventDefault();act(i,true)};
      gr.append(b);
    });
  }
  fl.onclick=()=>{flagMode=!flagMode;fl.textContent='flag: '+(flagMode?'on':'off');fl.style.color=flagMode?'var(--amber)':''};
  face.onclick=init;init();
  const o=openWin('Minesweeper',w,{w:330,h:420});onClose(o,()=>clearInterval(iv));return o;
}

function appBrowser(){

  const inp=$('input',w),pg=$('.pg',w);let hist=[],hi=-1;
  const pages={
    home:()=>`<div class="am" style="font-size:20px">LaggerNet</div><br>The only network here is the one inside this machine.<br><br>
      <a data-go="lager://files">lager://files</a> — browse your files<br><a data-go="lager://about">lager://about</a> — what this is<br><a data-go="lager://nothing">lager://nothing</a> — a page about nothing<br><br>
      <span class="dm">anything that starts with http:// goes nowhere.</span>`,
    about:()=>`<div class="am" style="font-size:18px">About</div><br>LaggerOS has no network stack. This browser renders local pages only.`,
    nothing:()=>`<div class="dm">( this page intentionally left blank )</div>`,
    files:()=>{const rows=[];const walk=(n,p)=>Object.keys(n.c).sort().forEach(k=>{const c=n.c[k],q=p+'/'+k;rows.push(c.t==='d'?`<span class="dm">${esc(q)}/</span>`:`<a data-go="lager://file${esc(q)}">${esc(q)}</a>`);if(c.t==='d')walk(c,q)});walk(FS,'');return `<div class="am">lager://files</div><br>`+rows.join('<br>')}
  };
  function view(u){
    u=u.trim();
    if(/^https?:\/\//i.test(u)||/^[\w-]+\.[a-z]{2,}/i.test(u)){
      P.netfails++;addXP(1);
      return `<div class="red" style="font-size:18px">This site can't be reached</div><br><span class="dm">${esc(u)}</span> could not be found.<br>ERR_INTERNET_DISCONNECTED<br><br>There is no internet. There never was, here.<br><br><a data-go="lager://home">back to LaggerNet</a>`;
    }
    const m=u.replace(/^lager:\/\//,'');

    return pages[m||'home']?pages[m||'home']():`<div class="red" style="font-size:18px">404</div><br>lager://${esc(m)} does not exist.`;
  }

    if(!u)return;if(!/^[a-z]+:\/\//i.test(u)&&!/^[\w-]+\.[a-z]{2,}/i.test(u))u='lager://'+u;
    if(push){hist=hist.slice(0,hi+1);hist.push(u);hi=hist.length-1}
    inp.value=u;pg.innerHTML=view(u);
  }
  pg.onclick=e=>{const a=e.target.closest('[data-go]');if(a)go(a.dataset.go)};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')go(inp.value)});
  $('.bk',w).onclick=()=>{if(hi>0){hi--;go(hist[hi],false)}};
  $('.hm',w).onclick=()=>go('lager://home');
  go('lager://home');
  return openWin('Browser',w,{w:520,h:380});
}

const MUSDB='laggeros-music';
const musDB=()=>new Promise((res,rej)=>{const r=indexedDB.open(MUSDB,1);r.onupgradeneeded=()=>r.result.createObjectStore('songs',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});

const BUILTIN=[
 {id:'b1',name:'Neon Static',tag:'house · 128 bpm',gen:true,bpm:128,style:'house',prog:[[57,'m'],[53,'M'],[48,'M'],[55,'M']]},
 {id:'b2',name:'Glitch Garden',tag:'half-time bass · 140 bpm',gen:true,bpm:140,style:'dub',prog:[[53,'m'],[49,'M'],[56,'M'],[51,'M']]},
 {id:'b3',name:'Void Drive',tag:'drum & bass · 174 bpm',gen:true,bpm:174,style:'dnb',prog:[[48,'m'],[44,'M'],[51,'M'],[46,'M']]},
 {id:'b4',name:'Midnight Offline',tag:'chill · 84 bpm',gen:true,bpm:84,style:'chill',prog:[[50,'m'],[46,'M'],[53,'M'],[48,'M']]},
 {id:'b5',name:'Lagger Anthem',tag:'uplifting · 124 bpm',gen:true,bpm:124,style:'anthem',prog:[[48,'M'],[55,'M'],[57,'m'],[53,'M']]}
];
const MUS={list:BUILTIN.slice(),idx:-1,playing:false,shuffle:false,vol:Number(store.get('laggeros.music.vol')||70),stopFn:null,t0:0,subs:new Set(),loaded:false};
let MA=null,OUT=null;
const mtof=m=>440*Math.pow(2,(m-69)/12);
const bn=(r,o)=>{let n=r-12*o;while(n<36)n+=12;return n};
const musEmit=()=>{MUS.subs.forEach(f=>f());updateMusBtn()};
function updateMusBtn(){const b=$('#mbtn');if(b){b.classList.toggle('pl',MUS.playing);b.title=MUS.playing?'Music — now playing: '+(MUS.list[MUS.idx]||{}).name:'Music'}}
function musInit(){
  if(MA)return MA;
  AC=AC||new(window.AudioContext||window.webkitAudioContext)();
  const gain=AC.createGain(),comp=AC.createDynamicsCompressor(),an=AC.createAnalyser();
  an.fftSize=128;an.smoothingTimeConstant=.78;
  gain.connect(comp);comp.connect(an);an.connect(AC.destination);
  MA={gain,an,el:null,url:null,nb:null};setMusVol();return MA;
}
function setMusVol(){if(MA)MA.gain.gain.value=MUS.vol/100*.85;store.set('laggeros.music.vol',String(MUS.vol))}
async function musLoad(){
  if(MUS.loaded)return;MUS.loaded=true;
  const recs=await dbAll();
  recs.forEach(r=>{if(r&&r.blob&&!MUS.list.some(t=>t.id===r.id))MUS.list.push({id:r.id,name:r.name,tag:'your file',file:true,blob:r.blob})});
  musEmit();
}
/* instruments */
function noiseBuf(){if(!MA.nb){const b=AC.createBuffer(1,AC.sampleRate,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;MA.nb=b}return MA.nb}
function kick(t,v=1){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);g.gain.setValueAtTime(v*.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(OUT);o.start(t);o.stop(t+.32)}
function noiseHit(t,{dur=.1,hp=5000,v=.3,type='highpass'}={}){const s=AC.createBufferSource();s.buffer=noiseBuf();const f=AC.createBiquadFilter();f.type=type;f.frequency.value=hp;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(OUT);s.start(t);s.stop(t+dur+.02)}
function tone(t,freq,dur,{type='sawtooth',v=.2,lp=2000,a=.005,detune=0,sweep=0}={}){
  const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
  o.type=type;o.frequency.value=freq;o.detune.value=detune;f.type='lowpass';f.frequency.setValueAtTime(lp,t);
  if(sweep)f.frequency.exponentialRampToValueAtTime(Math.max(120,lp*sweep),t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(f);f.connect(g);g.connect(OUT);o.start(t);o.stop(t+dur+.03);
}
const chordOf=(tr,bar)=>{const[root,q]=tr.prog[bar%tr.prog.length];return{root,tri:[root,root+(q==='m'?3:4),root+7]}};
const STYLES={
  house(s,bar,t,spb,tr){const{root,tri}=chordOf(tr,bar);
    if(s%4===0)kick(t);
    if(s===4||s===12)noiseHit(t,{dur:.14,hp:1800,v:.22,type:'bandpass'});
    if(s%4===2)noiseHit(t,{dur:.07,hp:7000,v:.12});else if(s%2===1)noiseHit(t,{dur:.03,hp:9000,v:.04});
    if(s%4===2)tone(t,mtof(bn(root,1)),spb*3,{lp:700,v:.25,sweep:.4});
    if(s%2===0)tone(t,mtof(tri[[0,1,2,1][(s/2)%4]]+12),spb*1.6,{type:'square',v:.05,lp:3200});
    if(s===0)tri.forEach((n,i)=>tone(t,mtof(n+12),spb*16,{v:.025,lp:900,a:.3,detune:(i-1)*8}));
  },
  dub(s,bar,t,spb,tr){const{root,tri}=chordOf(tr,bar);
    if(s===0||s===10)kick(t,1.1);
    if(s===8){noiseHit(t,{dur:.2,hp:1500,v:.3,type:'bandpass'});tone(t,190,.12,{type:'triangle',v:.2,lp:2000})}
    if(s%2===0)noiseHit(t,{dur:.04,hp:8000,v:.06});
    if(s===0||s===3||s===6||s===12)tone(t,mtof(bn(root,2)+(s===6?7:0)+(s===12?5:0)),spb*(s===0?3:2),{v:.3,lp:900,sweep:.15});
    if(s===0)tone(t,mtof(bn(root,2)),spb*7,{type:'sine',v:.35});
    if(s===4||s===7||s===14)tone(t,mtof(tri[(s+bar)%3]+12),spb*2,{type:'triangle',v:.12,lp:3000});
  },
  dnb(s,bar,t,spb,tr){const{root,tri}=chordOf(tr,bar);
    if(s===0||s===10)kick(t,1.1);
    if(s===4||s===12){noiseHit(t,{dur:.16,hp:1600,v:.3,type:'bandpass'});tone(t,200,.08,{type:'triangle',v:.2})}
    if(s%2===0)noiseHit(t,{dur:.03,hp:9000,v:.07});else if(s===7||s===15)noiseHit(t,{dur:.03,hp:9000,v:.05});
    if(s===0||s===6||s===10||s===13){tone(t,mtof(bn(root,2)+(s===10?3:0)),spb*(s===0?5:2.5),{type:'sine',v:.35});tone(t,mtof(bn(root,1)),spb*2,{v:.1,lp:500})}
    if(s===0)tri.forEach((n,i)=>tone(t,mtof(n+12),spb*16,{v:.025,lp:1100,a:.2,detune:(i-1)*10}));
    if(s%4===2&&bar%2===1)tone(t,mtof(tri[Math.floor(s/2)%3]+24),spb*1.2,{type:'square',v:.04,lp:4000});
  },
  chill(s,bar,t,spb,tr){const{root,tri}=chordOf(tr,bar);
    if(s===0||s===7||s===10)kick(t,.7);
    if(s===4||s===12)noiseHit(t,{dur:.12,hp:900,v:.14,type:'bandpass'});
    if(s%2===0)noiseHit(t,{dur:.04,hp:6000,v:.05});
    if(s===0){[...tri,root+10].forEach((n,i)=>tone(t,mtof(n+12),spb*16,{type:'triangle',v:.06,lp:1400,a:.15,detune:(i-1)*6}));tone(t,mtof(bn(root,1)),spb*8,{type:'sine',v:.3})}
    if(s===8)tone(t,mtof(bn(root,1)+7),spb*6,{type:'sine',v:.22});
    if((s===2||s===6||s===11)&&Math.random()<.65){const pent=[0,3,5,7,10];tone(t,mtof(root+24+pent[Math.floor(Math.random()*5)]),spb*4,{type:'sine',v:.1,lp:2500})}
  },
  anthem(s,bar,t,spb,tr){const{root,tri}=chordOf(tr,bar);
    if(s%4===0)kick(t);
    if(s===4||s===12)noiseHit(t,{dur:.14,hp:1800,v:.24,type:'bandpass'});
    if(s%4===2)noiseHit(t,{dur:.08,hp:7500,v:.12});
    if(s%2===0)tone(t,mtof(bn(root,1)),spb*1.6,{v:.2,lp:650,sweep:.5});
    if(s===0||s===3||s===6||s===10)tri.forEach((n,i)=>tone(t,mtof(n+12),spb*1.5,{v:.045,lp:2800,detune:(i-1)*9}));
    if(bar%4>=2&&s%2===0)tone(t,mtof(tri[[0,1,2,1,2,1,0,1][(s/2)%8]]+24),spb*1.2,{type:'square',v:.045,lp:4500});
  }
};
function startGen(tr){
  const spb=60/tr.bpm/4;let step=0,bar=0,next=AC.currentTime+.08;
  const id=setInterval(()=>{
    while(next<AC.currentTime+.25){STYLES[tr.style](step,bar,next,spb,tr);step++;if(step===16){step=0;bar++}next+=spb}
  },40);
  return()=>clearInterval(id);
}
function musHalt(){
  if(MUS.stopFn){try{MUS.stopFn()}catch(e){}MUS.stopFn=null}
  MUS.playing=false;
}
async function musPlay(i){
  if(!CFG.sound){toast('sound is off — turn it on in Settings');return}
  const tr=MUS.list[i];if(!tr)return;
  musInit();if(AC.state==='suspended'){try{await AC.resume()}catch(e){}}
  musHalt();MUS.idx=i;MUS.t0=Date.now();
  if(tr.gen){
    const out=AC.createGain();out.connect(MA.gain);OUT=out;
    const stopSeq=startGen(tr);
    MUS.stopFn=()=>{stopSeq();out.gain.setTargetAtTime(0,AC.currentTime,.05);setTimeout(()=>{try{out.disconnect()}catch(e){}},700)};
    MUS.playing=true;
  }else{
    if(!MA.el){
      MA.el=new Audio();MA.src=AC.createMediaElementSource(MA.el);MA.src.connect(MA.gain);
      MA.el.addEventListener('ended',()=>musNext(true));
    }
    if(MA.url)URL.revokeObjectURL(MA.url);
    MA.url=URL.createObjectURL(tr.blob);MA.el.src=MA.url;
    try{await MA.el.play();MUS.playing=true;MUS.stopFn=()=>MA.el.pause()}
    catch(e){toast('could not play "'+tr.name+'"');MUS.playing=false}
  }
  musEmit();
}
function musToggle(){
  if(MUS.playing){
    const tr=MUS.list[MUS.idx];
    if(tr&&tr.file&&MA&&MA.el){MA.el.pause();MUS.stopFn=null;MUS.playing=false}else musHalt();
    return musEmit();
  }
  if(MUS.idx<0)return musPlay(0);
  const tr=MUS.list[MUS.idx];
  if(tr&&tr.file&&MA&&MA.el&&MA.el.src&&MA.el.currentTime>0&&!MA.el.ended){
    if(!CFG.sound){toast('sound is off — turn it on in Settings');return}
    AC.resume&&AC.resume();
    MA.el.play().then(()=>{MUS.playing=true;MUS.stopFn=()=>MA.el.pause();musEmit()}).catch(()=>musPlay(MUS.idx));
  }else musPlay(MUS.idx);
}
function musNext(auto){
  const n=MUS.list.length;if(!n)return;
  let i;if(MUS.shuffle&&n>1){do{i=Math.floor(Math.random()*n)}while(i===MUS.idx)}else i=(MUS.idx+1)%n;
  musPlay(i);
}
function musPrev(){
  const tr=MUS.list[MUS.idx];
  if(tr&&tr.file&&MA&&MA.el&&MA.el.currentTime>3){MA.el.currentTime=0;return}
  musPlay((MUS.idx-1+MUS.list.length)%MUS.list.length);
}
async function musAdd(files){
  await musLoad();let added=0,memOnly=false;
  for(const f of files){
    if(!/^audio\//.test(f.type)&&!/\.(mp3|wav|ogg|m4a|aac|flac|opus|webm)$/i.test(f.name))continue;
    const rec={id:'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:f.name.replace(/\.[^.]+$/,'').slice(0,60),blob:f,added:Date.now()};
    const ok=PERSIST?await dbPut(rec):false;if(!ok)memOnly=true;
    MUS.list.push({id:rec.id,name:rec.name,tag:'your file',file:true,blob:f});added++;
  }
  if(added){addXP(3*added);toast(added+' song'+(added>1?'s':'')+' added'+(memOnly?' (this session only)':''))}
  else toast('no audio files found');
  musEmit();
}
async function musRemove(i){
  const tr=MUS.list[i];if(!tr||!tr.file)return;
  if(i===MUS.idx){musHalt();if(MA&&MA.el){MA.el.removeAttribute('src');MA.el.load&&MA.el.load()}MUS.idx=-1}
  else if(i<MUS.idx)MUS.idx--;
  MUS.list.splice(i,1);await dbDel(tr.id);musEmit();
}
setInterval(()=>{
  const tr=MUS.list[MUS.idx];
  if(MUS.playing&&tr&&tr.gen&&Date.now()-MUS.t0>150000)musNext(true);
},1000);

    <div class="dm fine2">The 5 built-in tracks are original music made live by this OS. Your own songs are copied into this laptop's browser storage and never leave it.<br>Want NCS tracks? LaggerOS can't download anything, so grab them from ncs.io on a connected device (keep their credit requirement), then add the files here.</div>`;
  const q=s=>$(s,w);
  const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
  const vl=q('.vl');vl.value=MUS.vol;vl.oninput=()=>{MUS.vol=Number(vl.value);setMusVol()};
  q('.pp').onclick=()=>musToggle();q('.nx').onclick=()=>musNext();q('.pv').onclick=()=>musPrev();
  q('.sf').onclick=()=>{MUS.shuffle=!MUS.shuffle;musEmit()};
  q('.ad').onclick=()=>q('.fi').click();
  q('.fi').onchange=e=>{const f=[...e.target.files];e.target.value='';if(f.length)musAdd(f)};
  q('.pgb').onclick=e=>{
    const tr=MUS.list[MUS.idx];if(!tr||!tr.file||!MA||!MA.el||!isFinite(MA.el.duration))return;
    const r=e.currentTarget.getBoundingClientRect();MA.el.currentTime=(e.clientX-r.left)/r.width*MA.el.duration;
  };
  let sig='';
  function draw(){
    const tr=MUS.list[MUS.idx];
    q('.mt1').textContent=tr?tr.name:'nothing playing';
    q('.ms1').textContent=tr?tr.tag+(tr.gen?' · original, generated live':''):'pick a track below';
    q('.pp').textContent=MUS.playing?'⏸':'▶';
    q('.sf').classList.toggle('on',MUS.shuffle);
    const s=MUS.list.map(t=>t.id).join(',')+'|'+MUS.idx+'|'+MUS.playing;
    if(s!==sig){
      sig=s;const ml=q('.ml');ml.innerHTML='';
      MUS.list.forEach((t,i)=>{
        const r=el('div','row'+(i===MUS.idx?' cur':''));
        r.innerHTML=`<span class="n">${i===MUS.idx&&MUS.playing?'♫ ':'· '}${esc(t.name)}</span><span class="s">${esc(t.tag)}</span>${t.file?'<span class="x" title="remove">✕</span>':''}`;
        r.onclick=e=>{
          if(e.target.classList.contains('x')){modal('Remove "'+t.name+'" from LaggerOS?',{ok:'remove'},()=>musRemove(i));return}
          musPlay(i);
        };
        ml.append(r);
      });
    }
  }
  function prog(){
    const tr=MUS.list[MUS.idx],bar=q('.pgb i');
    if(!tr){bar.style.width='0';q('.te').textContent='0:00';q('.tt').textContent='';return}
    if(tr.file&&MA&&MA.el){
      const d=MA.el.duration,c=MA.el.currentTime;bar.style.width=(isFinite(d)&&d?c/d*100:0)+'%';
      q('.te').textContent=fmt(c);q('.tt').textContent=isFinite(d)?fmt(d):'';
    }else{
      const e=MUS.playing?(Date.now()-MUS.t0)/1000:0;bar.style.width=Math.min(100,e/150*100)+'%';
      q('.te').textContent=fmt(e);q('.tt').textContent='live';
    }
  }
  const cv=q('.viz'),g=cv.getContext('2d');let raf,run=true,ph=0;
  const loop=()=>{
    if(!run)return;
    const W=cv.width,H=cv.height;g.fillStyle='#050607';g.fillRect(0,0,W,H);g.fillStyle=accent();
    const bars=32,bw=W/bars;
    if(MA&&MUS.playing){
      const arr=new Uint8Array(MA.an.frequencyBinCount);MA.an.getByteFrequencyData(arr);
      for(let i=0;i<bars;i++){const v=arr[Math.floor(i*arr.length*.75/bars)]/255;const h=Math.max(2,v*H);g.fillRect(i*bw+1,H-h,bw-2,h)}
    }else{ph+=.05;for(let i=0;i<bars;i++){const h=2+Math.abs(Math.sin(ph+i*.4))*3;g.globalAlpha=.4;g.fillRect(i*bw+1,H-h,bw-2,h)}g.globalAlpha=1}
    prog();raf=requestAnimationFrame(loop);
  };
  const sub=()=>draw();MUS.subs.add(sub);draw();loop();
  musLoad();
  const o=openWin('Music',w,{w:440,h:560});
  onClose(o,()=>{run=false;cancelAnimationFrame(raf);MUS.subs.delete(sub)});
  return o;
}

/* ---------- Battery (real, via the browser's Battery Status API) ---------- */
const BAT={ok:false,ready:false,level:null,charging:null,ct:null,dt:null,hist:[],subs:new Set(),warned:false,mgr:null,at:0};
const fmtDur=s=>{if(s==null||!isFinite(s)||s<=0)return null;const h=Math.floor(s/3600),m=Math.round((s%3600)/60);return h?`${h}h ${String(m).padStart(2,'0')}m`:`${m}m`};
const batPct=()=>Math.round(BAT.level*100);
const batNoBattery=()=>BAT.ok&&BAT.level===1&&BAT.charging&&BAT.ct===0&&!isFinite(BAT.dt);
function batStatusText(){
  if(!BAT.ok)return 'unavailable';
  if(batNoBattery())return 'plugged in — fully charged or no battery';
  if(BAT.charging)return BAT.level>=1?'fully charged':'charging'+(fmtDur(BAT.ct)?' · full in '+fmtDur(BAT.ct):'');
  return 'on battery'+(fmtDur(BAT.dt)?' · '+fmtDur(BAT.dt)+' left':' · estimating time left…');
}
function batUI(){
  const b=$('#bat');if(!b)return;
  b.classList.remove('lo','ch');
  if(!BAT.ok){b.textContent=BAT.ready?'BAT n/a':'BAT …';b.title=BAT.ready?'This browser does not share battery info. Use Chrome, Edge or Opera.':'Battery';return}
  const p=batPct();
  b.textContent=`BAT ${p}%${BAT.charging?' ⚡':''}`;
  b.title='Battery: '+p+'% — '+batStatusText();
  if(BAT.charging)b.classList.add('ch');else if(p<=20)b.classList.add('lo');
}
function batRead(){
  const m=BAT.mgr;if(!m)return;
  BAT.level=m.level;BAT.charging=m.charging;BAT.ct=m.chargingTime;BAT.dt=m.dischargingTime;BAT.at=Date.now();
  BAT.hist.push({t:BAT.at,l:BAT.level,c:BAT.charging});if(BAT.hist.length>300)BAT.hist.shift();
  const p=batPct();
  if(CFG.batwarn&&!BAT.charging&&p<=20&&!BAT.warned&&!batNoBattery()){BAT.warned=true;toast('Low battery: '+p+'% — plug in soon');beep(330,.15,'square',1.2);setTimeout(()=>beep(247,.25,'square',1.2),180)}
  if(BAT.charging||p>25)BAT.warned=false;
  batUI();BAT.subs.forEach(f=>f());
}
(function batInit(){
  BAT.ready=false;
  if(!navigator.getBattery){BAT.ready=true;BAT.ok=false;batUI();return}
  navigator.getBattery().then(m=>{
    BAT.mgr=m;BAT.ok=true;BAT.ready=true;
    ['levelchange','chargingchange','chargingtimechange','dischargingtimechange'].forEach(e=>m.addEventListener(e,batRead));
    batRead();setInterval(batRead,30000);
  }).catch(()=>{BAT.ready=true;BAT.ok=false;batUI()});
})();
function appBattery(){
  const w=el('div','pad bat');
  w.innerHTML=`<div class="big bp">—</div><div class="meter" style="margin:4px 0 10px"><div class="b" style="height:16px"><i class="bb" style="transition:width .6s linear"></i></div></div>
    <div class="bs am" style="margin-bottom:6px"></div><div class="dm bd"></div>
    <canvas class="bg" width="360" height="90" style="display:block;width:100%;height:90px;background:#050607;border:1px solid var(--line);margin:10px 0 4px"></canvas>
    <div class="dm" style="font-size:11px">level since LaggerOS opened (updates live from your laptop)</div><div class="dm bn" style="margin-top:8px;font-size:11px;line-height:1.5"></div>`;
  const q=s=>$(s,w);
  function draw(){
    if(!BAT.ok){
      q('.bp').textContent='n/a';q('.bb').style.width='0';
      q('.bs').textContent=BAT.ready?'battery info unavailable':'reading battery…';
      q('.bd').textContent='';
      q('.bn').innerHTML=BAT.ready?'This browser does not share battery data (Safari and Firefox block it). Open LaggerOS in Chrome, Edge or Opera on your laptop. The page must be opened from a file or a secure address.':'';
      return;
    }
    const p=batPct(),bb=q('.bb');
    q('.bp').textContent=p+'%'+(BAT.charging?' ⚡':'');
    bb.style.width=p+'%';bb.style.background=BAT.charging?'var(--green)':p<=20?'var(--red)':'var(--amber)';
    q('.bs').textContent=batStatusText();
    q('.bd').textContent='last reading '+new Date(BAT.at).toLocaleTimeString([],{hour12:!CFG.h24});
    q('.bn').textContent=batNoBattery()?'No battery was detected (a desktop computer, or a laptop that reports "always full"). Nothing to track.':'Readings come straight from your laptop through the browser. They never leave this machine.';
    const cv=q('.bg'),g=cv.getContext('2d'),W=cv.width,H=cv.height;
    g.fillStyle='#050607';g.fillRect(0,0,W,H);g.strokeStyle='#23272d';g.lineWidth=1;
    [.25,.5,.75].forEach(f=>{g.beginPath();g.moveTo(0,H*f);g.lineTo(W,H*f);g.stroke()});
    const h=BAT.hist;if(h.length<2){g.fillStyle='#6f6c62';g.font='11px monospace';g.fillText('collecting samples…',10,H/2);return}
    const t0=h[0].t,span=Math.max(60000,h[h.length-1].t-t0);
    g.strokeStyle=accent();g.lineWidth=2;g.beginPath();
    h.forEach((s,i)=>{const x=(s.t-t0)/span*(W-4)+2,y=H-2-s.l*(H-4);i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();
  }
  BAT.subs.add(draw);draw();
  const iv=setInterval(draw,5000);
  const o=openWin('Battery',w,{w:400,h:400});
  onClose(o,()=>{BAT.subs.delete(draw);clearInterval(iv)});return o;
}

/* ---------- boot ---------- */
const lines=[
 ['LAGGER-BIOS 0.1  —  memory check ........ ','ok','OK'],
 ['mounting virtual disk ................... ','ok','OK'],
 ['loading kernel: lagger-kernel 0.1 ....... ','ok','OK'],

 ['starting update service ................. ','bad','REFUSED'],
 ['severing uplink ......................... ','ok','DONE'],
 ['','dim','you are now alone. welcome to LaggerOS.']
];
const boot=$('#boot');let bi=0,done=false;
function finish(){
  if(done)return;done=true;
  boot.style.transition='opacity .5s';boot.style.opacity=0;setTimeout(()=>boot.remove(),500);

}
const spd={slow:1.8,normal:1,fast:.35}[CFG.bootspeed]||1;
